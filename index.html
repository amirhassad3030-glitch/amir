<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أُمير AI Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; color: var(--accent-green); }
        
        /* Model Selector dropdown style matching user image */
        .model-selector-container { position: relative; display: inline-block; }
        .model-btn { background: #1f2937; color: var(--text-main); border: 1px solid #374151; padding: 8px 16px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .model-dropdown { display: none; position: absolute; right: 0; top: 110%; background: #111827; border: 1px solid #374151; border-radius: 12px; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .model-dropdown.active { display: block; animation: fadeIn 0.2s ease; }
        .model-option { padding: 12px 15px; display: flex; flex-direction: column; cursor: pointer; border-bottom: 1px solid #1f2937; transition: background 0.2s; }
        .model-option:hover { background: #1f2937; }
        .model-option .title { font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .model-option .desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Main Chat Area */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message { padding: 12px 18px; border-radius: 16px; max-width: 75%; line-height: 1.5; font-size: 0.95rem; }
        .message.user { background: var(--accent-blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.ai { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }

        /* Input Area */
        .input-area { padding: 15px 20px; background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; border-radius: 20px 20px 0 0; }
        .input-area input { flex: 1; background: #1f2937; border: 1px solid #374151; padding: 12px 15px; border-radius: 12px; color: #fff; outline: none; font-size: 0.95rem; }
        .action-btn { background: #1f2937; border: 1px solid #374151; color: var(--accent-green); padding: 10px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-btn:hover { background: #374151; }
        .send-btn { background: var(--accent-green); color: #000; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>⚡ أُمير AI Studio</span>
        </div>
        
        <!-- Model Selector Matching User Image -->
        <div class="model-selector-container">
            <button class="model-btn" onclick="toggleDropdown()">
                <span id="current-model-text">Auto (Gemini 3 models)</span>
                <span>▼</span>
            </button>
            <div class="model-dropdown" id="modelDropdown">
                <div class="model-option" onclick="selectModel('Auto (Gemini 3 models)')">
                    <span class="title">Auto <span>✓</span></span>
                    <span class="desc">Gemini 3 models</span>
                </div>
                <div class="model-option" onclick="selectModel('3.1 Pro')">
                    <span class="title">3.1 Pro</span>
                    <span class="desc">High capability model</span>
                </div>
            </div>
        </div>

        <button class="action-btn" onclick="togglePCControl()" title="التحكم بالكمبيوتر">💻 التحكم</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">أهلاً بك يا أمير! أنا جاهز تماماً، كيف يمكنني مساعدتك اليوم في برمجة أو دراسة أو التحكم بجهازك؟</div>
    </div>

    <div class="input-area">
        <button class="action-btn" onclick="triggerCamera()" title="رفع صورة أو كاميرا">📷</button>
        <button class="action-btn" onclick="toggleVoice()" title="الوضع الصوتي">🎙️</button>
        <input type="text" id="userInput" placeholder="اكتب رسالتك أو أمرك هنا..." onkeypress="handleKeyPress(event)">
        <button class="action-btn send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function toggleDropdown() {
            document.getElementById('modelDropdown').classList.toggle('active');
        }
        function selectModel(modelName) {
            document.getElementById('current-model-text').innerText = modelName;
            toggleDropdown();
        }
        function sendMessage() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            const chat = document.getElementById('chatContainer');
            chat.innerHTML += `<div class="message user">${input.value}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
            
            setTimeout(() => {
                chat.innerHTML += `<div class="message ai">تم تلقي طلبك وجاري التنفيذ بنجاح يا أمير!</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 1000);
        }
        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }
        function togglePCControl() { alert("تم تفعيل وضع التحكم بالكمبيوتر والأوامر الصوتية المحلية!"); }
        function triggerCamera() { alert("فتح محرر الصور والكاميرا للحل الفوري."); }
        function toggleVoice() { alert("تشغيل وضع الصوت المباشر (Voice Orb)."); }
    </script>
</body>
</html>
